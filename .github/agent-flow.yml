version: 1
plugin: dbx-plugin-ldap
base_branch: main
branch_prefix: codex/ldap/
workflow:
  stages: [discovery, contract, implementation, review, integration, verification]
  merge_policy: integrator_only
  implementation_isolation: one_branch_per_agent
  dependencies:
    implementation: [contract]
    review: [implementation]
    integration: [review]
    verification: [integration]
ownership:
  # 协议契约没有独立文档（原 docs/PROTOCOL.zh-CN.md 自仓库创建起不存在）：
  # 方法面真值在 backend/internal/mcp/server.go，前端 API 形状在
  # frontend/src/lib/api.ts 与 shared/frontend/uiIntent.ts，审计 result 三值
  # 口径见 docs/PROGRESS-P-LDAP.zh-CN.md。contract 所有权只列真实存在的
  # 共享文件，避免 contract 阶段守幽灵文件。
  contract: [manifest.json]
  backend: [backend/]
  frontend: [frontend/, manifest.json]
  tests: [scripts/]
  integrator: [ui/, dist/, version_metadata, shared_contract_docs]
validation:
  local:
    - python3 scripts/validate_repo.py
    - node scripts/connection-forms/verify.mjs ldap
    - PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
    - pnpm --dir frontend typecheck
    - pnpm --dir frontend test
    - pnpm --dir frontend build
    - '(cd backend && gofmt -l main.go internal | test -z "$(cat)" )'
    - '(cd backend && go vet ./... && go test ./...)'
  ci_required: [validate, frontend, ui-walkthrough, backend, integration, candidates-check]
security:
  secrets: ephemeral_only
  production_access: forbidden
  directory_access: local_container_only
  generated_artifacts: integrator_only


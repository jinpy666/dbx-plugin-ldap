name: LDAP plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_CLI_VERSION: "0.1.3"
  # Windows runners default python stdout to cp1252; the smoke script prints
  # Unicode (→, ✓) and would die on UnicodeEncodeError. UTF-8 mode is a no-op
  # on the other platforms.
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Validate repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/validate_repo.py
      - run: node scripts/connection-forms/verify.mjs ldap
      # Offline unit tests for the smoke harness itself (result attribution,
      # scenario runner). No sidecar, no docker needed.
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      # setup-node 的 pnpm 缓存需要 pnpm 已在 PATH 中，故置于 pnpm/action-setup 之后
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - name: Committed ui/ output is fresh
        run: |
          if ! git diff --quiet -- ui/; then
            git diff --stat -- ui/
            echo "ui/ is stale: run 'pnpm --dir frontend build' and commit the output" >&2
            exit 1
          fi

  ui-walkthrough:
    name: Browser UI walkthrough (mock host)
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      # Real-browser walkthrough against the vite dev server + mock host
      # (playwright-core + system Chrome, both provisioned by the script;
      # runner images ship Chrome stable). Skips instead of failing when a
      # browser is unavailable.
      - run: node scripts/ui_test.mjs

  backend:
    name: Go sidecar checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - run: (cd backend && go vet ./... && go test ./...)

  integration:
    name: LDAP container integration smoke
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DBX_PLUGIN_SIDECAR: ${{ github.workspace }}/backend/bin/dbx-plugin-ldap
      LDAP_TEST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sidecar
        run: (cd backend && CGO_ENABLED=0 go build -trimpath -o bin/dbx-plugin-ldap .)
      # Scenario S1-S18 against a live OpenLDAP container (admin password is
      # generated per run and only ever passes through the environment).
      - name: Plain-LDAP scenarios (S1-S18)
        env:
          LDAP_ADMIN_PASSWORD: ci-plain-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/smoke_container.py
      # T1-T6 TLS matrix (ldaps/StartTLS/verify/mutual exclusion) + A1-A5 auth
      # surface against a live container with a self-signed server cert.
      - name: TLS + auth scenarios (T1-T6, A1-A5)
        env:
          LDAP_ADMIN_PASSWORD: ci-tls-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/smoke_auth_test.py
      # L1-L3 ldapi:// unix-socket SASL EXTERNAL (sidecar cross-compiled to the
      # container's architecture, driven inside the container).
      - name: ldapi SASL EXTERNAL scenarios (L1-L3)
        run: python3 scripts/smoke_ldapi_test.py

  candidate:
    name: Package candidate (${{ matrix.target }})
    needs: [validate, frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            target: linux-x64
            python: python3
          - os: linux
            runner: ubuntu-24.04-arm
            target: linux-arm64
            python: python3
          - os: macos
            runner: macos-15
            target: darwin-arm64
            python: python3
          - os: macos
            runner: macos-15-intel
            target: darwin-x64
            python: python3
          - os: windows
            runner: windows-2022
            target: windows-x64
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # Windows Go 产物带 .exe 后缀；smoke 步骤按平台拼出真实二进制路径。
      SIDECAR_BINARY: backend/bin/dbx-plugin-ldap${{ matrix.os == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      # build.sh 内部做前端三件套 + go build sidecar + 原生 CLI 打包；
      # 这里先按 lockfile 装依赖，build.sh 检测到 node_modules 即跳过 install。
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"
      - name: Package .dbxp candidate
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
          NO_COLOR: "1"
        run: bash scripts/build.sh
      - name: Offline MCP smoke
        run: ${{ matrix.python }} scripts/smoke_mcp.py
        env:
          DBX_PLUGIN_SIDECAR: ${{ env.SIDECAR_BINARY }}
      - uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-ldap-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.dbxp
            dist/*.artifact.json

  candidates-check:
    name: Cross-target candidate checks
    needs: [candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dbx-plugin-ldap-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/check_candidates.py dist --expect linux-x64,linux-arm64,darwin-arm64,darwin-x64,windows-x64

name: Release DBX LDAP plugin

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  PLUGIN_CLI_VERSION: "0.1.3"
  # Windows runners default python stdout to cp1252; UTF-8 mode is a no-op
  # on the other platforms.
  PYTHONUTF8: "1"

jobs:
  validate:
    if: startsWith(github.event.release.tag_name, 'ldap-v')
    name: Validate LDAP release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/validate_repo.py
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          import pathlib
          import sys
          version = json.loads(pathlib.Path("manifest.json").read_text())["version"]
          expected = f"ldap-v{version}"
          if sys.argv[1] != expected:
              raise SystemExit(f"release tag {sys.argv[1]!r} does not match {expected!r}")
          PY

  build:
    if: startsWith(github.event.release.tag_name, 'ldap-v')
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            target: linux-x64
          - os: linux
            runner: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos
            runner: macos-15
            target: darwin-arm64
          - os: macos
            runner: macos-15-intel
            target: darwin-x64
          - os: windows
            runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"
      - name: Package .dbxp candidate
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
          NO_COLOR: "1"
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-ldap-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.dbxp
            dist/*.artifact.json

  integration:
    if: startsWith(github.event.release.tag_name, 'ldap-v')
    name: LDAP container integration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DBX_PLUGIN_SIDECAR: ${{ github.workspace }}/backend/bin/dbx-plugin-ldap
      LDAP_TEST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sidecar
        run: (cd backend && CGO_ENABLED=0 go build -trimpath -o bin/dbx-plugin-ldap .)
      - name: Plain-LDAP scenarios (S1-S18)
        env:
          LDAP_ADMIN_PASSWORD: ci-plain-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/smoke_container.py
      - name: TLS + auth scenarios (T1-T6, A1-A5)
        env:
          LDAP_ADMIN_PASSWORD: ci-tls-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/smoke_auth_test.py
      - name: ldapi SASL EXTERNAL scenarios (L1-L3)
        run: python3 scripts/smoke_ldapi_test.py

  publish:
    if: startsWith(github.event.release.tag_name, 'ldap-v')
    name: Publish plugin release assets
    needs: [build, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dbx-plugin-ldap-*
          path: dist
          merge-multiple: true
      - name: Validate candidates and merge metadata
        run: |
          python3 scripts/check_candidates.py dist \
            --expect linux-x64,linux-arm64,darwin-arm64,darwin-x64,windows-x64 \
            --write-release-candidates dist/release-candidates.json
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -d '' packages < <(find dist -type f -name '*.dbxp' -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No .dbxp packages were downloaded" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${packages[@]}" dist/release-candidates.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
